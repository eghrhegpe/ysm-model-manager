name: CI

# 方案②：main push / PR 只触发本 workflow（测试门禁），不再触发 release.yml。
# test 门禁复用可复用 workflow test.yml，与发版（tag 触发 release.yml）共享同一份测试。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # test.yml（可复用 workflow）需要 actions:read 读取/缓存；workflow_call 权限继承调用方，
  # 必须在此显式授予，否则解析失败（startup_failure）。
  actions: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    # 变更范围（ADR-244）：push 用 event.before（本次推送的起点）、PR 用 base.sha；
    # workflow_dispatch 二者皆无 → 空串 → 脚本退回本地解析（= 旧行为）。
    with:
      changed-base: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
