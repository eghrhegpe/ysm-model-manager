name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # 只在真正喂给 Pages 的路径变更时部署：docs 站点 + frontend web 版。
    # 纯 Go / 纯 scripts push 与站点无关，不应重跑整套契约 + VitePress + web 构建（2026-10 锐评 ①）。
    # docs/** 与 ci.yml 的 paths-ignore 互补：docs-only 变更只触发本 workflow，不烧 CI 五件套。
    paths:
      - 'docs/**'
      - 'frontend/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

# Pages 部署权限：只读仓库内容，写入 Pages，签发 OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# 并发：同一时刻只允许一个 Pages 部署在跑，新推送取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建站点（VitePress · docs/）
    runs-on: ubuntu-24.04
    # 补装 Job 级超时（2026-10-08 锐评）：缺省 ceiling 是 360min，契约测试 / 断链 / 构建任一环节
    # 卡死（apt 慢镜像、npm 卡 registry）会静默干烧到天花板。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 ripgrep（契约测试依赖 rg 二进制；ubuntu-24.04 默认未预装）
        run: sudo apt-get update -y && sudo apt-get install -y ripgrep

      # test_config_defaults.ts（83bcd8d33）：CI 下缺 AppConfig = 零覆盖假绿 ⇒ 显式 FAIL。
      # 注入 mock fixture（单一源：tests/fixtures/ysm_config.ci.json）；
      # 对齐 configPath() 的 linux 分支：$HOME/.config/YSM-Model-Manager/ysm_config.json。
      - name: 注入 mock AppConfig（契约测试结构校验）
        shell: bash
        run: |
          mkdir -p "$HOME/.config/YSM-Model-Manager"
          cp tests/fixtures/ysm_config.ci.json "$HOME/.config/YSM-Model-Manager/ysm_config.json"

      # 统一走 scripts/contract-tests.ts（与 test.yml / 本地 pre-push-gate 同源：收集 /
      # 域裁剪 / @/ 别名运行时注入 / 并发 / 失败复跑全复用 _lib/contract-tests.ts）。
      # ⚠️ 勿退回手写 `for f in tests/*.ts; do node "$f"; done` 裸跑循环——裸跑缺
      # ts-alias-register 的 @/ 别名注入，任何 import 链进入 frontend @/ 别名的契约测试
      # 都会 ERR_MODULE_NOT_FOUND（本地绿、Pages 红；实测命中 test_contract_alias_runtime.ts
      # 与 test_cube_uv_quad_vertex.ts，而前者存在的意义正是钉住这个钩子——裸跑时护栏自毁）。
      # 护栏：tests/test_workflow_contract_runner.ts（静态扫 workflow，禁裸跑写法）。
      - name: 契约测试（tests/，Node .ts，禁止修改测试文件）
        shell: bash
        run: node scripts/contract-tests.ts

      - name: 断链检查（失败不部署）
        shell: bash
        run: node scripts/link-checker.ts --strict

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装依赖 + VitePress 构建（srcDir = docs/）
        # npm ci 而非 npm install（2026-10-08 锐评）：docs/ 自带 package-lock.json 且实证同步
        #（2026-10-08 npm install --dry-run = up to date），裸 install 在 lockfile 与 package.json
        # 失同步时会静默重解析 ⇒ 站点产物不可复现。
        run: |
          cd docs
          npm ci
          npm run build

      - name: Web 版构建（ADR-049：网页版主 UI，base=/ysm-model-manager/app/）
        # frontend 是 pnpm 工程（frontend/pnpm-lock.yaml）：此前 npm install 无视 lockfile
        # 全量重新解析依赖 ⇒ 站点产物与 CI/E2E 可能用不同版本的传递依赖，发布不可复现
        #（2026-10-08 锐评）。docs/ 是独立 npm 工程（有自己的 package-lock.json），
        # 上方 VitePress 构建步骤保持 npm 不动。
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          WEB_BASE=/ysm-model-manager/app/ pnpm run build:web

      - name: 合并网页版产物到站点 /app/ 子目录
        # 先清后拷：VitePress 曾渲染 docs/app/ 占位页到同路径 dist/app，
        # 目标已存在时 `cp -r <src> <dst>` 会把 src 作为子目录复制（dst/app/dist-web/），
        # 且不覆盖旧 index.html，导致 /app/ 仍返回占位页。须先删除旧目录再整体拷入。
        run: |
          rm -rf docs/.vitepress/dist/app
          cp -r frontend/dist-web docs/.vitepress/dist/app

      - name: 上传产物（VitePress 输出目录，含网页版 /app/）
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
