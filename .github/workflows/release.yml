name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 契约测试 + Go 检查 + 前端构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 契约测试（tests/，Node .mjs，禁止修改测试文件）
        shell: pwsh
        run: |
          $files = Get-ChildItem tests/*.mjs
          foreach ($f in $files) { node $f.FullName }

      - name: ADR 登记一致性（adr-check — G-2 治理门槛）
        shell: pwsh
        run: node scripts/adr-check.mjs | Out-String -Width 200

      - name: 安装前端依赖
        # 必须前置于「治理静态检查」：check-deadcode-baseline.mjs 依赖
        # frontend/node_modules 中的 knip / jscpd，否则以「工具缺失」exit 1。
        working-directory: frontend
        shell: pwsh
        run: npm ci

      - name: 治理静态检查（G-2：文档漂移 + 链接 + 死代码基线）
        shell: pwsh
        run: |
          node scripts/link-checker.mjs | Out-String -Width 200
          node scripts/check-doc-drift.mjs | Out-String -Width 200
          node scripts/check-deadcode-baseline.mjs | Out-String -Width 200

      - name: 脚本卫生检查（禁止内联 ROOT 样板，--strict 阻断）
        # P6 收口护栏：scripts/*.mjs 出现内联 ROOT 样板 / 文件头缺失 / 退出码失效 即 exit 1，
        # 防止 P2–P6 双仓 scripts 约定回退。--strict 将 WARN 升级为失败。
        shell: pwsh
        run: node scripts/check-script-hygiene.mjs --strict

      - name: 脚本单测（_lib 共享层回归，node --test）
        # P8-a：为 scripts/_lib 共享层补 Node 原生单测（零依赖、node:test）。
        # 覆盖与 A 字节一致的 parse-args / to-posix / frontmatter 三模块；
        # source-graph（双栈适配）、circular、supersede 等需先本地 node --test 验证再扩展本步。
        shell: pwsh
        run: node --test scripts/_lib/parse-args.test.mjs scripts/_lib/to-posix.test.mjs scripts/_lib/frontmatter.test.mjs

      - name: 构建更新助手 helper（embed 前置，修复 go vet 缺文件）
        # go/updater/update.go 通过 //go:embed 内嵌 ysm-updater-helper.exe，
        # 该文件由 cmd/updater/main.go 编译生成（见 cmd/build-release.ps1 步骤 1b），
        # 且被 .gitignore(*.exe) 忽略，CI checkout 不含此文件。
        # 必须先构建，否则 go vet/go build/go test 因 embed 找不到文件而失败。
        shell: pwsh
        run: go build -o "go/updater/ysm-updater-helper.exe" "./cmd/updater"

      - name: Go vet
        shell: pwsh
        run: go vet ./go/... | Out-String -Width 200

      - name: Go test
        shell: pwsh
        run: go test ./go/... -count=1 | Out-String -Width 200

      - name: TypeScript 类型检查（ADR-014 P4 门槛，tsc --noEmit）
        working-directory: frontend
        shell: pwsh
        run: npm run typecheck | Out-String -Width 200

      - name: 前端单测（ADR-023 P3，L3 Vitest 回归）
        working-directory: frontend
        shell: pwsh
        run: npx vitest run | Out-String -Width 200

      - name: 前端构建
        working-directory: frontend
        shell: pwsh
        run: npx vite build

  release:
    name: 发布打包（仅 tag v*）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    # softprops/action-gh-release 需建 Release + 传资产，默认 GITHUB_TOKEN（只读）
    # 会 403 "Resource not accessible by integration"，必须显式声明写权限。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Wails v3 CLI（build-release.ps1 的 generate:bindings 需要）
        # 版本对齐 go.mod（wailsapp/wails/v3 v3.0.0-alpha2.105），
        # 避免 CLI 与库版本错配导致 build 异常。GOPATH/bin 已在 PATH（task 同路径可寻），
        # 故安装后 wails3 可直接被 build-release.ps1 调用。
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.105

      - name: 安装前端依赖
        # build-release.ps1 的 npx vite build 需要 frontend/node_modules。
        working-directory: frontend
        shell: pwsh
        run: npm ci

      - name: 打包（build-release.ps1 → build/release zip + SHA256SUMS）
        # 项目标准发版脚本（SOP §1），产出 build/release/YSM-Model-Manager_windows_amd64.zip
        # + SHA256SUMS，与下方上传步骤的 files 路径吻合。
        # 注意：不走 Taskfile 的 NSIS 安装器链路（task package 产出 bin/*-installer.exe，
        # 与上传路径脱节，且需额外 makensis/NSIS 依赖，历史多次阻断）。
        shell: pwsh
        run: |
          & .\cmd\build-release.ps1 -Version "${{ github.ref_name }}" -SkipUpload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/*.zip
            build/release/SHA256SUMS
