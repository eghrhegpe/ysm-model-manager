name: Release

on:
  push:
    tags: ['v*']
# workflow_dispatch 已移除（2026-10-08 锐评 P0）：prepare/release 仅在 tag ref 生效，
# dispatch（branch ref）下 prepare 被 skip → 全部 build* 连带 skip，实际只跑 test 却整体报「success」，
# 面板看着绿、发布啥也没做（2026-08-09 两轮 dispatch run 实测 5 个 job 全 skipped）。手动只跑测试
# 已由 ci.yml 的 dispatch 覆盖，移除此触发不损失能力。

permissions:
  contents: write
  actions: read

# 并发取消（2026-10-08 锐评 P0，与 ci.yml 同款）：发版通道此前无并发控制（裸奔）。
# 同 ref 重推/重触发只保留最新一轮——旧 run 的产物已被新 run 作废，排队干烧四平台构建分钟纯浪费；
# 不同 ref（tag）独立分组（release-<ref>），发版流水线仍并行不互相取消。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # GO_VERSION 退役：Go 工具链单一事实源 = go.mod（各 build job 用 go-version-file，与 test.yml 门禁同版）。
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}
  # 兜底值 = 当前仓库 Variables 实值（2026-10-08 gh variable list 核定）；必须与 go.mod 的
  # github.com/wailsapp/wails/v3 版本一致（当前 v3.0.0-beta.26），避免 CLI 与库版本错配。
  WAILS_VERSION: ${{ vars.WAILS_VERSION || 'v3.0.0-beta.26' }}

jobs:
  # ── 测试门禁（可复用 workflow test.yml，main/PR 由 ci.yml 调用）───
  test:
    uses: ./.github/workflows/test.yml
    # 变更范围（ADR-244 + 2026-09 审查 P1）：不能直接传 event.before——
    # 新 tag 的 event.before 是全零 SHA（非提交对象），脚本会识别为全零基线退回本地解析；
    # CI 本地三源全空 ⇒ 责任集 null ⇒ 严格模式全阻断（与旧行为同病）。
    # 修正在解析层（scripts/_lib/deadcode-attrib.ts）：全零 base 时试 `git describe` 找上一个
    # 可达发版 tag 作归属基线；取不到（首版/异常）仍退回本地解析兜底，行为与旧版一致。
    with:
      changed-base: ${{ github.event.before }}

  # ── 版本提取与校验 ─────────────────────────────────────
  prepare:
    name: Prepare（版本校验）
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: 校验 tag 与 config.yml 版本一致
        id: ver
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          # 版本单一事实来源：build/config.yml（发版脚本同步，非 package.json）
          CFG_VER=$(grep -E '^\s+version:' build/config.yml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          echo "tag=$TAG_VER config.yml=$CFG_VER"
          if [ "$TAG_VER" != "$CFG_VER" ]; then
            echo "::error::版本不一致！tag=$TAG_VER config.yml=$CFG_VER"
            echo "Fix: 更新 build/config.yml 版本后重新打 tag。"
            exit 1
          fi
          echo "version=$TAG_VER" >> "$GITHUB_OUTPUT"

  # ── Windows 构建 ───────────────────────────────────────
  build-windows:
    name: Windows
    needs: [prepare, test]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      # 工具链 spine（setup-go/pnpm/node + go-mod/wails3 缓存 + 前端依赖）抽到共享 composite action，
      # 与 linux/darwin/android 同一份（原三段逐字重复；GHA 不支持 YAML 锚点，composite 是唯一合规 DRY）。
      - uses: ./.github/actions/release-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
          wails-version: ${{ env.WAILS_VERSION }}
          go-mod-cache: 'false'  # Windows 实测不缓存 go 模块更快（Defender 扫解压小文件是瓶颈）
      - name: 打包（build-release.ps1 → build/release 裸 exe + SHA256SUMS）
        run: |
          & .\scripts\build-release.ps1 -Version "${{ needs.prepare.outputs.version }}" -SkipUpload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: windows-amd64
          path: |
            build/release/*.exe
            build/release/SHA256SUMS
          if-no-files-found: error

  # ── Linux 构建 ─────────────────────────────────────────
  build-linux:
    name: Linux
    needs: [prepare, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # 工具链 spine 抽到共享 composite action（与 windows/darwin/android 同一段）。
      - uses: ./.github/actions/release-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
          wails-version: ${{ env.WAILS_VERSION }}
          go-mod-cache: 'true'  # Linux 解压快，保留 go 模块缓存
      # OS 专属：Linux 桌面需 GTK4 + WebKitGTK 6.0 系统库（wails3 build 编译期依赖）。
      - name: 安装 Linux 系统依赖（GTK4 + WebKitGTK 6.0）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libatk1.0-dev \
            libgirepository1.0-dev
      - name: 打包（build-linux.sh → dist/ 二进制）
        run: |
          bash ./scripts/build-linux.sh "${{ needs.prepare.outputs.version }}"
      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: linux-amd64
          path: dist/YSM-Model-Manager-*-linux-*
          if-no-files-found: error

  # ── macOS 构建 ─────────────────────────────────────────
  build-darwin:
    name: macOS
    needs: [prepare, test]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # 工具链 spine 抽到共享 composite action（与 windows/linux/android 同一段）。
      - uses: ./.github/actions/release-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
          wails-version: ${{ env.WAILS_VERSION }}
          go-mod-cache: 'true'  # macOS 解压快，保留 go 模块缓存
      - name: 打包（build-darwin.sh → dist/ 二进制）
        run: |
          bash ./scripts/build-darwin.sh "${{ needs.prepare.outputs.version }}"
      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: darwin-arm64
          path: dist/YSM-Model-Manager-*-darwin-*
          if-no-files-found: error

  # ── Android 构建（NDK 交叉编译 + gradle APK）───────────
  build-android:
    name: Android
    needs: [prepare, test]
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      # 工具链 spine 抽到共享 composite action（与 windows/linux/darwin 同一段；android 亦跑在 windows-latest）。
      - uses: ./.github/actions/release-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
          wails-version: ${{ env.WAILS_VERSION }}
          go-mod-cache: 'false'  # android-on-windows 同 Windows：不缓存 go 模块更快
      # OS 专属：Android NDK 交叉编译工具链。
      - uses: android-actions/setup-android@v4
      - name: 安装 Android SDK 组件（platform + build-tools + NDK）
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
      - name: 解码签名 keystore（可选，无则 debug 构建）
        run: |
          $dir = "${{ github.workspace }}\build\android\keystore"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $file = "$dir\release.keystore"
          $b64 = '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'
          if ([string]::IsNullOrWhiteSpace($b64)) {
            Write-Output "ANDROID_KEYSTORE_BASE64 未设置 — 跳过签名（debug 构建）"
            return
          }
          [System.IO.File]::WriteAllBytes($file, [System.Convert]::FromBase64String($b64))
          Write-Output "Keystore 已解码"
      - name: 检查 keystore 是否存在
        id: check_ks
        run: |
          $ks = "${{ github.workspace }}\build\android\keystore\release.keystore"
          if (Test-Path $ks) { echo "has_keystore=true" >> $env:GITHUB_OUTPUT }
          else { echo "has_keystore=false" >> $env:GITHUB_OUTPUT }
      - name: 打包（build-android.ps1，有 keystore 则 release 签名）
        if: steps.check_ks.outputs.has_keystore == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}\build\android\keystore\release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          pwsh -ExecutionPolicy Bypass -File .\scripts\build-android.ps1 "${{ needs.prepare.outputs.version }}" -Arch arm64 -Production
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 打包（build-android.ps1，无 keystore → debug）
        if: steps.check_ks.outputs.has_keystore != 'true'
        run: |
          pwsh -ExecutionPolicy Bypass -File .\scripts\build-android.ps1 "${{ needs.prepare.outputs.version }}" -Arch arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: android-arm64
          path: dist/*.apk
          if-no-files-found: error

  # ── 合并发布到 GitHub Release ──────────────────────────
  release:
    name: GitHub Release
    needs: [prepare, build-windows, build-linux, build-darwin, build-android]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - name: 下载全部产物
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true
      - name: 列示产物
        run: ls -lh release-assets/
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
