name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 契约测试 + Go 检查 + 前端构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 契约测试（tests/，Node .mjs，禁止修改测试文件）
        shell: pwsh
        run: |
          $files = Get-ChildItem tests/*.mjs
          foreach ($f in $files) { node $f.FullName }

      - name: 构建更新助手 helper（embed 前置，修复 go vet 缺文件）
        # go/updater/update.go 通过 //go:embed 内嵌 ysm-updater-helper.exe，
        # 该文件由 cmd/updater/main.go 编译生成（见 cmd/build-release.ps1 步骤 1b），
        # 且被 .gitignore(*.exe) 忽略，CI checkout 不含此文件。
        # 必须先构建，否则 go vet/go build/go test 因 embed 找不到文件而失败。
        shell: pwsh
        run: go build -o "go/updater/ysm-updater-helper.exe" "./cmd/updater"

      - name: Go vet
        shell: pwsh
        run: go vet ./go/... | Out-String -Width 200

      - name: Go test
        shell: pwsh
        run: go test ./go/... -count=1 | Out-String -Width 200

      - name: 安装前端依赖
        working-directory: frontend
        shell: pwsh
        run: npm ci

      - name: TypeScript 类型检查（ADR-014 P4 门槛，tsc --noEmit）
        working-directory: frontend
        shell: pwsh
        run: npm run typecheck | Out-String -Width 200

      - name: 前端单测（ADR-023 P3，L3 Vitest 回归）
        working-directory: frontend
        shell: pwsh
        run: npx vitest run | Out-String -Width 200

      - name: 前端构建
        working-directory: frontend
        shell: pwsh
        run: npx vite build

  release:
    name: 发布打包（仅 tag v*）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Task（Wails v3 构建脚手架）
        shell: pwsh
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: 打包（Taskfile → build/windows/package）
        shell: pwsh
        run: |
          $env:APP_VERSION = "${{ github.ref_name }}"
          task package

      - name: 上传 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/*.zip
            build/release/SHA256SUMS
