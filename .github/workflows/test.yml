name: Test Gate

# 可复用测试门禁（方案②）：ci.yml（main/PR）与 release.yml（tag 发版）共享，
# 避免 main push 与 tag push 各跑一遍完整测试。
# 版本单点：Go 工具链走 go-version-file: go.mod；NODE_VERSION / WAILS_VERSION 读仓库级 Variables（带硬兜底）。

on:
  workflow_call:
    inputs:
      # 本次变更范围的基线 ref（ADR-244，供变更上下文类门禁做归属裁剪）。空值 → 脚本退回本地解析。
      # 详见 ci-tuning。
      changed-base:
        description: 本次变更范围的基线 ref（供变更上下文类门禁做归属裁剪）
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  # 兜底值仅在仓库 Variables 被误删/清空时接住。WAILS_VERSION 必须与 go.mod 的 wails/v3 一致。详见 ci-tuning。
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}
  WAILS_VERSION: ${{ vars.WAILS_VERSION || 'v3.0.0-beta.26' }}

jobs:
  # ── 变更域判定 Job（2026-10-08 第三轮审计：按 paths 自动裁）────────────────────
  # 动机：此前 7 个 job 全部无条件跑（`ci.yml` 的 `paths-ignore` 只有 docs/** 与 **.md，
  # 粒度太粗）——只改 Go 也要白跑前端 4 个 job、只改前端也要白跑 Go 2 个 job。
  # ⚠️ 为何需要独立 job：**GHA 的 job 级 `if` 拿不到变更文件列表**（paths 不在 job 上下文），
  # 所以必须由一个 job 先算、其余 job 经 `needs` + `outputs` 消费。刻意用 `git diff` 原生实现
  # 而非引入 dorny/paths-filter（本仓零第三方 action 倾向 + 已有 changed-base 基线语义）。
  #
  # **保守优先原则（漏跑比多跑危险得多）**：任何**无法归类**的路径（含 .github/**、
  # 顶层 *.json、go.mod、package.json 等）一律置全部域为 true ⇒ 退回全量跑。
  # 宁可多跑，绝不在「不确定影响面」时静默跳过。
  changes:
    name: 变更域判定
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      go: ${{ steps.detect.outputs.go }}
      contracts: ${{ steps.detect.outputs.contracts }}
      all: ${{ steps.detect.outputs.all }}
      # 解析后的**真实基线 ref**（供 diff-coverage 类门禁消费，见 §8e）。
      # ⚠️ 必须由本 job 产出而非让各门禁自己默认 origin/main：CI 跑在 push 之后，
      # checkout 的 HEAD 与 fetch 到的 origin/main 指向**同一提交** ⇒ `git diff
      # origin/main...HEAD` 为空 ⇒ 门禁落「无改动源码 ⇒ 通过」分支**恒空跑**（假绿，
      # 实测 run 37806261054 两个 diff-coverage 门禁均如此）。本输出即那个「HEAD 之前
      # 的真实基线」。
      base: ${{ steps.detect.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        env:
          BASE: ${{ inputs.changed-base }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # 基线解析（与 ADR-244 同口径）：显式 changed-base 优先；否则退回 HEAD~1。
          # 全零 SHA（新 tag / 首次推送）与非提交对象 ⇒ 退回 HEAD~1（或全量，见下）。
          # workflow_dispatch（手动触发）无变更上下文 ⇒ 直接全量（人手动跑通常是想看全貌）。
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "手动触发 ⇒ 全量跑"; echo "all=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"; echo "go=true" >> "$GITHUB_OUTPUT"
            echo "contracts=true" >> "$GITHUB_OUTPUT"; echo "base=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "${BASE:-}" ] && ! echo "$BASE" | grep -qE '^0+$' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            RANGE="$BASE..HEAD"
            # 消费方拿的是 BASE 本身（diff-coverage 传 --base），不是 RANGE。
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify HEAD~1 >/dev/null 2>&1; then
            RANGE="HEAD~1..HEAD"
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            echo "无可用基线（浅历史/首个提交）⇒ 全量跑"
            echo "all=true" >> "$GITHUB_OUTPUT"; echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "contracts=true" >> "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FILES=$(git diff --name-only "$RANGE" || true)
          echo "变更范围: $RANGE"; echo "$FILES" | sed 's/^/  /'
          # ⚠️ 空变更集必须保守全量（2026-10-08 判定表自测发现）：否则四域全 false ⇒
          # 所有 job 跳过 ⇒ 「CI 绿」但什么都没跑（**假绿通道**，比多跑危险得多）。
          # 空集可能来自：BASE==HEAD、range 解析异常、或 git diff 输出被吞。
          if [ -z "$(echo "$FILES" | tr -d '[:space:]')" ]; then
            echo "变更集为空（无文件可比对）⇒ 保守全量跑"
            echo "all=true" >> "$GITHUB_OUTPUT"; echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "contracts=true" >> "$GITHUB_OUTPUT"
            # 空集时 base 已写过（BASE 或 HEAD~1），保留不动——消费方拿到它仍能定位范围；
            # 若确实无可用基线，上面的分支已写 base= 空且此处不再覆盖。
            exit 0
          fi
          fe=false; go=false; ct=false; all=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              frontend/*|e2e/*|e2e-web/*)
                fe=true
                # 依赖清单与工具链配置影响面跨域（lock 变更可能改变任意 job 的解析结果），
                # 故单独提级为全量——不落「只跑前端」的窄口径（2026-10-08 判定表自测发现）。
                case "$f" in
                  frontend/pnpm-lock.yaml|frontend/package.json|frontend/tsconfig*.json|frontend/vite.config.*|frontend/biome.json|frontend/playwright*.ts)
                    all=true; go=true; ct=true ;;
                esac
                ;;
              go/*|internal/*|cmd/*|*.go|go.mod|go.sum) go=true ;;
              scripts/*|tests/*|docs/*) ct=true ;;
              # 跨域或无法归类 ⇒ 全量（保守）
              .github/*|*.json|*.md|package.json|pnpm-lock.yaml|frontend/pnpm-lock.yaml)
                all=true; fe=true; go=true; ct=true ;;
              *) all=true; fe=true; go=true; ct=true ;;
            esac
          done <<< "$FILES"
          echo "域判定: frontend=$fe go=$go contracts=$ct all=$all"
          echo "frontend=$fe" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "contracts=$ct" >> "$GITHUB_OUTPUT"
          echo "all=$all" >> "$GITHUB_OUTPUT"

  # ── 契约/治理 Job：契约测试 + 绑定保鲜 + 治理闸（纯静态/契约，不跑重型编译）──────────
  # ⚠️ 本 job 全程不装前端依赖——「契约测试不依赖前端依赖」是隐性防线。详见 ci-tuning。
  contracts:
    name: 契约测试 + 治理闸
    needs: [changes]
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.all == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # 契约测试用真实历史 ref 对做端到端断言，需全量历史。详见 ci-tuning。
          fetch-depth: 0

      # WAILS 版本双源守卫：go.mod ↔ WAILS_VERSION 漂移即红。纯文件读取、fail-fast。详见 ci-tuning。
      - name: WAILS 版本双源守卫（go.mod ↔ WAILS_VERSION）
        shell: pwsh
        run: |
          $m = Select-String -Path 'go.mod' -Pattern 'github\.com/wailsapp/wails/v3\s+(v\S+)' | Select-Object -First 1
          if (-not $m) { Write-Error 'go.mod 未找到 wails/v3 版本'; exit 1 }
          $wailsInGoMod = $m.Matches[0].Groups[1].Value
          if ($wailsInGoMod -ne $env:WAILS_VERSION) {
            Write-Error "WAILS_VERSION 双源漂移：go.mod=$wailsInGoMod / env=${env:WAILS_VERSION}——请同步仓库级 Variables（WAILS_VERSION）与 go.mod 的 wails/v3 版本"
            exit 1
          }
          Write-Host "WAILS 版本守卫通过：go.mod=$wailsInGoMod == WAILS_VERSION=${env:WAILS_VERSION}"

      # Go 工具链单一事实源 = go.mod；setup-go cache 必须 false（默认在 Windows 是负优化）。详见 ci-tuning。
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # ⚡ 勿回退为默认 true。详见 ci-tuning。
          cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # 本 job 刻意不配 cache: pnpm——全程不跑 pnpm install，缓存只会空转。详见 ci-tuning。

      - name: 安装 ripgrep（契约测试依赖 rg 二进制）
        shell: pwsh
        run: |
          $v = "14.1.0"
          $zip = "$env:RUNNER_TEMP\rg.zip"
          $dir = "$env:RUNNER_TEMP\rg-$v"
          $url = "https://github.com/BurntSushi/ripgrep/releases/download/$v/ripgrep-$v-x86_64-pc-windows-gnu.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          # 供应链校验：官方不附 windows zip 的 sha256 sidecar，故哈希内联钉死。
          # ⚠️ 升级 $v 须同步换 $want，不匹配即失败。详见 ci-tuning。
          $want = "4f2dc22621a7b75031a28d34582ba01af1fe5eeacebfa089a495250d9186917c"
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($got -ne $want) { Write-Error "ripgrep zip SHA256 不匹配：want=$want got=$got"; exit 1 }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $rg = Get-ChildItem -Path $dir -Recurse -Filter rg.exe | Select-Object -First 1
          $bin = $rg.Directory.FullName
          Write-Host "rg.exe at: $bin"
          Add-Content -Path "$env:GITHUB_PATH" -Value $bin
          & "$bin\rg.exe" --version

      - name: 注入 mock AppConfig（契约测试结构校验）
        shell: pwsh
        run: |
          $dir = Join-Path $env:APPDATA "YSM-Model-Manager"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item tests/fixtures/ysm_config.ci.json (Join-Path $dir "ysm_config.json") -Force

      # 统一走 scripts/contract-tests.ts（与本地 pre-push-gate 同源：域裁剪 + @/ 别名运行时注入）。
      # ⚠️ 勿退回手写 `for f in tests/*.ts | node $f` 裸跑循环（缺 @/ 注入 ⇒ 本地绿、CI 红）。
      # 护栏：tests/test_workflow_contract_runner.ts。详见 ci-tuning。
      - name: 契约测试（tests/，Node .ts，禁止修改测试文件）
        shell: pwsh
        run: node scripts/contract-tests.ts

      - name: 绑定契约对账（binding-check — Go 导出 vs -ts 产物）
        shell: pwsh
        run: node scripts/binding-check.ts


      # 缓存 wails3 单文件 exe（免每次 go install 源码冷编译）。key 内嵌 WAILS_VERSION ⇒ 升级自动 miss。
      # 详见 ci-tuning。
      - name: 缓存 wails3 CLI 二进制
        id: wails3-bin
        uses: actions/cache@v5.1.0
        with:
          path: ~/go/bin/wails3.exe
          key: wails3-bin-${{ runner.os }}-${{ env.WAILS_VERSION }}

      - name: 安装 wails3 CLI（缓存未命中时 go install 源码编译）
        if: steps.wails3-bin.outputs.cache-hit != 'true'
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: 注册 wails3 到 PATH 并验证（命中与否都执行）
        shell: pwsh
        run: |
          $goBin = "$(go env GOPATH)/bin"
          Add-Content -Path $env:GITHUB_PATH -Value $goBin
          & "$goBin/wails3.exe" version

      - name: 绑定产物保鲜（重新生成必须零 diff）
        shell: pwsh
        run: |
          pnpm -C frontend run generate:bindings
          git diff --exit-code -- frontend/bindings
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Go 签名变更但 frontend/bindings 未重新生成/提交"
            exit 1
          }

      # ADR 登记一致性（adr-check）已于 2026-10-08 迁往文档域 CI（pages-deploy.yml）。
      # 理由：它校验 docs/adr/ 文件 ↔ adr/index.md 登记表，消费方是 VitePress 侧边栏
      # （sidebar.gen.mjs 从 index.md 生成 ADR 导航），属**文档站自洽**问题，与
      # 「应用能否构建/运行」正交。放本 workflow 会让纯 Go/前端改动也付文档检查的代价，
      # 且发版路径被文档问题卡死（v1.16.0 实证）。pages-deploy 的 `paths: docs/**`
      # 保证 ADR 改动必然触发，覆盖不漏。详见 ci-tuning。

      # 红线零新增门禁：CI 侧远端防线（本地 pre-push 可被逃生阀绕过）。本 job 不装前端依赖，
      # check-redlines 为纯文本治理扫描。详见 ci-tuning。
      - name: 红线零新增门禁（check-redlines — R1-R10/W1-W6）
        shell: pwsh
        run: |
          # 人读文本模式（2026-10-08 统一输出策略，照抄下方「静态治理门禁」的既有决策）：
          # CI 日志消费方是人眼 + Actions 面板；--json 会被 Actions 按列宽硬折行、
          # 不识别 \n 转义，失败详情碎片化淹没。文本模式逐条列 [债务规则 WARN]/[已清理]，
          # 带 文件:规则:行号，可直接定位。退出码语义两模式一致（已实测 exit 均为同一判定）。
          node scripts/check-redlines.ts --baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ── 前端 Job：类型检查 + Vitest（功能正确性）──────────────────────────────
  # ⚠️ 本 job 只放「功能正确性」检查，治理闸已拆到 frontend-gates（2026-10-08 门禁锐评 R5）。
  # 病灶（实测）：治理闸原先排在本 job 最前（死代码 6s + --static 1m25s），任一失败即
  # `skipped` 掉其后的 vite build / tsc / vitest——一个 5s 的治理检查饿死 3m49s 的核心测试，
  # 且 CI 上「功能是否正常」这个问题根本没有机会被回答（本地手动跑 tsc/vitest 感知不到）。
  # 修法：治理与功能拆 job ⇒ 并行 + 各自独立报红；功能检查前置且不被治理闸阻断。
  # 详见 ci-tuning。
  frontend:
    name: 前端（类型检查 + Vitest）
    # 变更域裁剪（见顶部 changes job）：仅前端域变更时跑；否则跳过（省 Windows 分钟）。
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.all == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          # ⚠️ diff-coverage 门禁（本 job 末步）要 `origin/main` 可解析做变更行归属——
          # 浅克隆下该 ref 与 merge-base 均不可达 ⇒ 脚本 fail-closed exit 2（非静默放行）。
          # 与 go job 同口径。配套纪律：本 job 的 git fetch 一律不带 --depth（浅 fetch 会把
          # 整仓退化为浅克隆，HEAD~1/merge-base 失明）。详见 ci-tuning。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: frontend
        shell: pwsh
        run: pnpm install --frozen-lockfile

      # 本 job 只做前端自身检查（tsc / vitest / vite build），不需要 Go 编译。
      - name: 前端构建
        working-directory: frontend
        shell: pwsh
        run: pnpm exec vite build

      - name: 前端类型检查（ADR-014 门槛）
        working-directory: frontend
        shell: pwsh
        run: pnpm exec tsc --noEmit

      - name: 前端测试（Vitest）
        working-directory: frontend
        shell: pwsh
        run: |
          pnpm exec vitest run --coverage | Out-String -Width 200
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 前端 diff-coverage 门禁：消费上方 vitest --coverage 产出的 coverage-final.json，
      # 只查**本次变更源码的变更行**覆盖率（阈值 60%）。与全局 thresholds 的分工：
      # thresholds 防整体回退，本步防「新代码裸奔」。
      # 接线前史（2026-10-08）：直接接会引入 9 个假红（实测 v1.15.0..HEAD 219 文件），
      # 根因是脚本与 vitest 的 exclude 口径不对齐——① vitest 明文排除的 3D 装配入口
      # （happy-dom 无 WebGL，覆盖改由 **e2e-web** 承担）/ vendor / test-utils；② 纯类型与纯
      # 再导出文件（编译后无语句）。已在 check-diff-coverage.ts 加 `isVitestExcluded` +
      # `hasNoCoverableStatements` 两个判据消解（跳过项显式列出，非静默），9→3 且余 3 个为真低覆盖。
      # ⚠️ 前置：① checkout 须 fetch-depth: 0 且 base ref 可解析（否则 fail-closed exit 2，
      #   故意不空跑放行）；② 必须排在 vitest 之后；③ 根目录运行（脚本按 ROOT 解析
      #   frontend/coverage/，非 frontend cwd）。详见 ci-tuning。
      - name: 前端增量覆盖率门禁（check-diff-coverage）
        shell: pwsh
        run: |
          # git fetch 不带 --depth（浅 fetch 退化全仓 ⇒ 基线失明，见 pre-push-gate 卡同族教训）。
          git fetch origin main 2>$null
          # ⚠️ 基线必须显式传：脚本默认 base=origin/main，而 CI 跑在 push 之后——checkout 的
          # HEAD 与 fetch 到的 origin/main 指向**同一提交** ⇒ diff 为空 ⇒ 本门禁落「无改动源码
          # ⇒ 通过」分支**恒空跑**（假绿，实测 run 37806261054 前后端两门禁均如此）。
          # `changes` job 已把 BASE 解析成「HEAD 之前的真实基线」（含全零 SHA → HEAD~1 兜底）。
          # 该输出为空（无可用基线的极端场景）时不传 --base，退回脚本默认（此时域判定已保守
          # 全量，判定语义另议）。
          if ("${{ needs.changes.outputs.base }}" -ne "") {
            node scripts/check-diff-coverage.ts --base "${{ needs.changes.outputs.base }}"
          } else {
            node scripts/check-diff-coverage.ts
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ── 前端静态治理 Job：死代码基线 + 静态治理闸（改动纪律，与功能正确性正交）──────
  # 与 frontend job 并行。拆分的理由（2026-10-08 门禁锐评 R5）：
  #   ① 关注点正交——「代码能不能跑」（tsc/vitest）与「有没有引入新债」（死代码/32 项治理）
  #      是两个问题，混在一个 job 里会让后者对前者拥有一票否决权（顺序在前即饿死后者）；
  #   ② 归因清晰——两步各自报红，一眼看出是功能坏了还是纪律破了；
  #   ③ 关键路径缩短约 1m31s（原 frontend job 串行 5m27s → 功能 job 3m56s + 本 job 并行）。
  # 详见 ci-tuning。
  frontend-gates:
    name: 前端静态治理（死代码 + 治理闸）
    # 阶段门控（2026-10-08 第三轮技术债审计 P1-3）：本 job 两步的主成本
    # （check-deadcode-baseline + pre-push-gate --static）跑的都是 scripts/ 里的治理工具，
    # 而 `contracts` job 正是「验证这些工具自身」的契约测试（127 项）。
    # 契约红 ⇒ 工具自身有问题 ⇒ 本 job 的结论不可信（会报一堆误导性红），先等它。
    # 净影响实测（run 37788034328 口径）：`frontend-gates` **不在关键路径**上
    # （关键路径 = contracts 152s → e2e/e2e-web 各约 330s ≈ 8min，E2E 本就在等 contracts），
    # 本 job 自身约 1–2min，152s + 120s ≈ 272s < 477s ⇒ **不拉长总时长**，只消除白跑与误导。
    # ⚠️ 与域裁剪的组合（2026-10-08）：本 job 既依赖 contracts（上面的理由），又要按域裁剪。
    # GHA 语义坑：needs 的上游若被 skipped，本 job 默认也 skipped（即使自身 if 为真）——
    # 而 `contracts` 在「非 contracts 域」时正是被跳过的。故 if 里必须显式用
    # `always() && <域条件>` 覆盖该默认传播，否则「只改 frontend/**」时本 job 会被
    # contracts 的 skipped 连带拖掉（前端治理闸静默消失——正是要避免的失明模式）。
    needs: [changes, contracts]
    if: |
      always() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.all == 'true')
      && (needs.contracts.result == 'success' || needs.contracts.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 40
    # ⚠️ 责任范围（ADR-244）必须挂在 **job 级**：死代码扫描在本 job 内有两处执行点
    # ——下方「死代码基线门禁」独立步骤 + `pre-push-gate --static` 内部清单同款扫描。
    # 挂 step 级时后者拿不到归属上下文 → 退严格模式把一切新增按阻断（假红）。
    # 详见 ci-tuning。
    env:
      YSM_DEADCODE_BASE: ${{ inputs.changed-base }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 死代码基线门禁需要 inputs.changed-base 在历史中可解析（浅克隆拿不到 ⇒ 恒退严格模式全阻断）。
          # 详见 ci-tuning。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: frontend
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: 死代码基线门禁（check-deadcode-baseline，依赖 knip/jscpd → pnpm install 后跑）
        shell: pwsh
        # YSM_DEADCODE_BASE 见上方 job 级 env（两处执行点共用同一归属基线）。
        # ⚠️ 本步**必须保留 `--json`**，与上面「统一人读模式」的改动刻意相反：
        # 脚本 L322 `if (blocking.length === 0 && absorbable.length > 0 && !JSON_OUT)`
        # 用 JSON_OUT 作为「CI 不写盘」的开关——CI 侧写基线无意义（跑在 push 之后、
        # 且写盘不随提交入库 ⇒ 下次比对仍见同一批「新增」），故注释明写
        # 「CI（--json）只报告不写盘」。去掉 --json 会让 CI 在 absorbable>0 时写 runner 工作区，
        # 重演知识卡 pre-push-gate.md「基线自动收编必须随提交入库」记的那次事故形态。
        # 可读性代价由 `| Out-String -Width 200` 承担（--json 下这是唯一人读手段）。
        run: |
          node scripts/check-deadcode-baseline.ts --json | Out-String -Width 200
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 本地 gate 的静态 hard 项在 CI 的远端兜底（否则逃生阀可零痕迹直推 main）。
      # 用 --static 不用 --all（后者重跑 vite/vitest/go，与下方步骤重复）。详见 ci-tuning。
      - name: 静态治理门禁（pre-push-gate --static：本地 hard 项的远端兜底）
        shell: pwsh
        # 人读文本模式（不加 --json）：CI 日志的消费方是人眼 + Actions 面板，
        # 而 --json 会把 32 项检查的 raw（工具原始输出全量内嵌）塞进一坨 JSON——
        # Actions 按固定列宽硬折行、不识别 \n 转义，失败详情全被碎片化淹没。
        # 文本模式输出策展过的 OK 列表 + FAIL 摘要块（归属→前 ≤4 条错误→复现）+ 结论尾行，
        # 退出码语义两模式完全一致（见 pre-push-gate.ts finishJson 注释）。
        run: |
          node scripts/pre-push-gate.ts --static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  # ── Go Job：Go 编译/测试/覆盖率 ────────────────────────────────────────────
  go:
    name: Go（build + vet + test）
    # 变更域裁剪（见顶部 changes job）：仅 Go 域变更时跑。
    needs: [changes]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.all == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          # 覆盖率两件套要真实基线（merge-base / HEAD~1），浅克隆不可解析 ⇒ 门禁硬阻断。
          # 配套纪律：本 job 的 git fetch 一律不带 --depth。详见 ci-tuning。
          fetch-depth: 0

      # Go 工具链单一事实源 = go.mod；setup-go cache 必须 false（默认在 Windows 是负优化）。详见 ci-tuning。
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # ⚡ 勿回退为默认 true。详见 ci-tuning。
          cache: false

      # ⚠️ 本 job 用 pnpm install + vite build（go:embed 前置），须有 pnpm/action-setup + setup-node；
      # 三个 Windows job 的 setup 段必须一致。详见 ci-tuning。
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: frontend
        shell: pwsh
        run: pnpm install --frozen-lockfile

      # ⚠️ 顺序约束：go build/vet/test ./... 都要求 frontend/dist 已存在（main.go //go:embed）。
      # 本 job 重建而不下发 artifact：vite build 仅 2.3s，比 artifact 上传下载 + 失去并行更划算。
      # 详见 ci-tuning。
      - name: 前端构建（embed 前置：main.go //go:embed all:frontend/dist 依赖此产物）
        working-directory: frontend
        shell: pwsh
        run: pnpm exec vite build

      - name: 构建更新助手 helper（embed 前置，修复 CI 缺 ysm-updater-helper.exe）
        shell: pwsh
        run: go build -ldflags "-X ysm-model-manager/go/version.Version=ci" -o go/updater/ysm-updater-helper.exe ./cmd/updater

      # 本 job 保留真跑 go test 的桌面测试（race + 覆盖率）与覆盖率两件套（只有 Windows 能原生
      # 构建执行桌面目标 + 本仓测试代码含 Windows 专有符号）；golangci-lint 已迁 go-analysis
      # 并行。详见 ci-tuning。
      #
      # ⚠️ 2026-10-08 合并（第三轮技术债审计）：原「-race 一遍 + -coverprofile -p 1 一遍」跑两遍
      # 同一批测试（本地实测 121.6s + 58.7s = 180.3s）。现合并为 **一次编译同时出 race 与覆盖率**。
      #
      # 与 ci-tuning §5「方案 A 试错（已回退）」的区别（**勿混为一谈**）：被打回的是
      # `race+cover 同键 + -p 1`——知识卡记「Go job 从约 6min 涨到约 8min」。变慢的主因是
      # **`-p 1` 把所有包串行化**（race 下极贵），不是「合并」本身。本次方案**不带 `-p 1`**。
      #
      # 实测（本机 Windows，go 与 CI 同平台；各口径独立计时）：
      #   -race 单独                 121.6s
      #   -coverprofile -p 1 单独     58.7s
      #   现状两遍合计               180.3s
      #   合并（-race -coverprofile，无 -p 1）  100.1s   ← 省 80.2s（-44%）
      #   且合并后连跑 4 次全绿、无 FAIL（原 -p 1 是为规避 coverprofile 下
      #   `internal/app|go/scanner` 的已知 flaky；不带 -p 1 的 4/4 通过是本轮证据，
      #   但样本仍小——若 CI 出现该 flaky，回退手段见下）。
      # 回退方式（保命开关）：恢复两个独立步骤（本注释上方 git 历史即有原文），
      # 或给合并步临时加 `-p 1`（慢但对 flaky 更稳）。
      - name: Go 检查（build + vet + test -race + 覆盖率）
        shell: pwsh
        run: |
          # ./... 而非 ./go/...：后者会漏掉根 internal/app（Wails 绑定层，79 文件）与 cmd/updater。
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # ./... 而非 ./go/... ./internal/app/：后者是双路径补丁写法，新增顶层包会静默漏检。
          # 一次编译同时产出 race 判定（退出码）与覆盖率趋势（coverprofile 产物）。
          # -coverprofile 路径必须加引号（PS 成员访问坑，见 ci-tuning §5）；-timeout 硬阀防烧满 job。
          New-Item -ItemType Directory -Force '.coverage' | Out-Null
          go test -race ./... -coverprofile='.coverage/go-cover.out' -count=1 -timeout 15m | Out-String -Width 400
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Go 覆盖率趋势（非阻断，仅 main）：与上方同一次编译的产物，仅做汇总展示，
      # **不再重复跑测试**。continue-on-error 沿用原语义（趋势可见、不阻断）。
      - name: Go 覆盖率报告（非阻断，趋势可见；仅 main）
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        run: |
          # 产物由上方「Go 检查」步产出（同一次编译）。缺产物说明上一步未跑到，
          # 此处显式提示而非静默给 0（假绿防线）。
          if (-not (Test-Path '.coverage/go-cover.out')) {
            Write-Error '未找到 .coverage/go-cover.out——上方「Go 检查」步未产出覆盖率产物'
            exit 1
          }
          go tool cover -func='.coverage/go-cover.out' | Select-String 'total:'

      # Go 增量覆盖率门禁（ADR-145/ADR-202）：只查本次变更 Go 文件的变更行覆盖率（须置于 Go 检查后）。
      # ⚠️ 只能留 Windows（需真跑 go test）；git fetch 不带 --depth（浅 fetch 会退化全仓）。
      # 详见 ci-tuning §5/§6。
      - name: Go 增量覆盖率门禁（check-go-diff-coverage）
        shell: pwsh
        run: |
          git fetch origin main 2>$null
          # ⚠️ 同前端门禁：默认 base=origin/main 在 CI（push 之后）与 HEAD 同提交 ⇒ 恒空跑假绿
          # （实测 run 37806261054）。显式传 `changes` 解析出的真实基线。详见 ci-tuning §8e。
          if ("${{ needs.changes.outputs.base }}" -ne "") {
            node scripts/check-go-diff-coverage.ts --base "${{ needs.changes.outputs.base }}"
          } else {
            node scripts/check-go-diff-coverage.ts
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ── Go 静态分析（golangci-lint 迁 Linux 独立并行；钉 ubuntu-24.04）──────────
  # ⚠️ 关键手法：GOOS=windows 跨平台类型检查（非在 Linux 编译 Linux 目标）——默认 GOOS=linux 会
  # 选中 wails linux_cgo（需 GUI dev 库）且 executil_test 用 Windows 专有符号，二者皆编不过；
  # GOOS=windows + CGO_ENABLED=0 纯 Go 无 GUI 依赖，语义等价于原 Windows 上 lint。详见 ci-tuning §4。
  # 覆盖率两件套（diff-coverage / 报告）不迁——要真跑 go test，Windows 二进制无法在 Linux 执行（§5）。
  go-analysis:
    name: Go 静态分析（golangci-lint）
    # 变更域裁剪（见顶部 changes job）：仅 Go 域变更时跑。
    needs: [changes]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 跨平台类型检查 Windows 目标：与原先在 Windows 上跑 lint 同 GOOS，语义等价；
      # CGO_ENABLED=0 避免任何 C 工具链/系统库依赖（wails Windows 侧纯 Go）。
      GOOS: windows
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          # 增量 lint 需要真实历史 ref（merge-base / HEAD~1）。
          fetch-depth: 0

      # Go 工具链单一事实源 = go.mod；setup-go cache 必须 false（与 go job 同口径）。详见 ci-tuning。
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # ⚡ 勿回退为默认 true。详见 ci-tuning。
          cache: false

      # main.go 有 `//go:embed all:frontend/dist`，golangci-lint 类型检查 main 包要求产物存在，
      # 故本 job 也要 pnpm + vite build（成本仅 2.3s）。
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 前端构建（embed 前置：main.go //go:embed all:frontend/dist 依赖此产物）
        working-directory: frontend
        run: pnpm exec vite build

      # 同上：被 embed 的更新助手 exe 也须先产出（GOOS=windows 下交叉编译出 .exe）。
      - name: 构建更新助手 helper（embed 前置）
        run: go build -ldflags "-X ysm-model-manager/go/version.Version=ci" -o go/updater/ysm-updater-helper.exe ./cmd/updater

      # 缓存 golangci-lint 分析结果（ADR-205 §2.3）：不配则每次冷跑。
      - name: 缓存 golangci-lint 分析结果（命中免重分析）
        uses: actions/cache@v5.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-Linux-${{ hashFiles('.golangci.yml', '**/go.sum') }}
          restore-keys: |
            golangci-lint-Linux-

      # 版本门槛（ADR-205 §2.4）：须 >= v1.64（老版本解析 go1.26 的 go directive 直接失败），
      # 钉定 ADR 实测通过的 v2.13.2（built with go1.26.3）。官方 linux-amd64 预编译包，免源码编译。
      - name: 安装 golangci-lint（v2.13.2 预编译包，免源码编译）
        run: |
          v="2.13.2"
          url="https://github.com/golangci/golangci-lint/releases/download/v$v/golangci-lint-$v-linux-amd64.tar.gz"
          curl -sSL -o /tmp/gl.tar.gz "$url"
          tar -xzf /tmp/gl.tar.gz -C /tmp
          # ⚠️ $GITHUB_PATH 只对后续 step 生效，同 step 内须用绝对路径验证（否则 exit 127）。详见 ci-tuning §4。
          bin="/tmp/golangci-lint-$v-linux-amd64/golangci-lint"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          "$bin" --version

      - name: Go 静态分析（golangci-lint，仅增量）
        run: |
          # 增量而非全量：全量会撞 736 条存量债（errcheck 623 占 85%）→ 每次 CI 必红、门禁即废。
          # 与本地 pre-push 同口径（ADR-205 §2.3）：PR 取 base ref 的 merge-base，push 取 HEAD~1。
          # fetch-depth: 0 已保证历史可用；首个提交无基线则跳过（不惩罚，同 pre-push 降级口径）。
          base=""
          if [ -n "$GITHUB_BASE_REF" ]; then
            # ⚠️ 勿恢复 `git fetch ... --depth=1`：浅 fetch 退化全仓 ⇒ merge-base 与 HEAD~1 失明
            # （2026-09-15 main 恒红事故复刻）。fetch-depth:0 已克隆全量，base ref 本地就有。详见 ci-tuning §6。
            base=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD 2>/dev/null)
          fi
          if [ -z "$base" ]; then base=$(git rev-parse HEAD~1 2>/dev/null); fi
          if [ -z "$base" ]; then
            echo "无基线 rev（首个提交 / 浅历史），跳过 golangci-lint"
            exit 0
          fi
          echo "golangci-lint 增量基线: $base"
          golangci-lint run --new-from-rev=$base ./...

  # ── E2E（Playwright · vite dev 纯前端 + mock bridge）──────────────────────
  # 参数见 playwright.config.ts（7min 总限 / 15s 每项 / maxFailures=2，ADR-037）；webServer 自动管理。
  e2e:
    name: E2E（Playwright）
    # 阶段门控：契约失败大概率前端契约崩，最贵的一档不空跑。详见 ci-tuning §8。
    # 变更域裁剪（2026-10-08）：E2E 验的是前端产物 ⇒ 仅前端域变更时跑。
    # 与 contracts 的组合见 frontend-gates 处的说明：上游 skipped 会连带本 job，
    # 故必须 `always() &&` 覆盖默认传播（否则「只改 frontend/**」时最贵档静默消失）。
    needs: [changes, contracts]
    if: |
      always() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.all == 'true')
      && (needs.contracts.result == 'success' || needs.contracts.result == 'skipped')
    runs-on: ubuntu-24.04
    # 显式超时：Playwright 总限只管测试段，webServer/下载/apt 卡死不受管（缺省 360min 静默干烧）。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # 工具链 spine 抽到共享 composite action（与 e2e-web 同一份；原两段逐字重复，
      # 缓存 key 改一次要改两处，改漏一处不报错、只会让其中一 job 静默全 miss）。
      # GHA 不支持 YAML 锚点，composite 是唯一合规 DRY 机制。详见 ci-tuning §7。
      - uses: ./.github/actions/playwright-spine
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: E2E 类型检查（mock 契约守卫）
        working-directory: frontend
        run: pnpm exec tsc -p tsconfig.e2e.json --noEmit

      - name: E2E 测试（7min 总限 / 15s 每项 / maxFailures=2）
        working-directory: frontend
        run: pnpm exec playwright test --reporter=line

      - name: 上传 E2E 报告（失败时保留现场）
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: frontend/test-results/
          if-no-files-found: ignore

      # 「可选非门禁」名副其实：continue-on-error 防 bash -e 连坐整个 step；广度报告仍是产物上传。
      - name: E2E 覆盖广度采集（ADR-035 G-4，可选非门禁）
        continue-on-error: true
        working-directory: frontend
        run: |
          pnpm exec playwright test --config playwright.coverage.config.ts
          node ../scripts/e2e-coverage-report.ts --json

      - uses: actions/upload-artifact@v6
        with:
          name: e2e-coverage-report
          path: frontend/e2e-coverage/
          if-no-files-found: ignore

  # ── E2E-Web（Playwright · 真 WebGL 管线 + SwiftShader 软渲染，ADR-049 web 版）──
  # SwiftShader 参数已下沉 playwright.web.config.ts project 级统一钉住；类型检查复用 e2e 的
  # tsconfig.e2e.json（双套件同域，不重复跑）。详见 ci-tuning §8。
  e2e-web:
    name: E2E-Web（真 WebGL）
    # 阶段门控：同 e2e——契约失败不空跑最贵档。详见 ci-tuning §8。
    # 变更域裁剪与 always() 覆盖：同 e2e（上游 skipped 不得连带本 job）。
    needs: [changes, contracts]
    if: |
      always() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.all == 'true')
      && (needs.contracts.result == 'success' || needs.contracts.result == 'skipped')
    runs-on: ubuntu-24.04
    # SwiftShader 无 GPU 软渲染显著慢于 headless Chromium，预算放宽一档。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # 工具链 spine 与 e2e 共用同一份 composite action（缓存 key 单点，改一处即两 job 同步）。
      - uses: ./.github/actions/playwright-spine
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: E2E-Web 测试（20s 每项 / 7min 总限 / SwiftShader 软渲染）
        working-directory: frontend
        run: pnpm exec playwright test --config playwright.web.config.ts --reporter=line

      - name: 上传 E2E-Web 报告（失败时保留现场）
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-web-report
          path: frontend/test-results/
          if-no-files-found: ignore

  # ── 汇总 Job（2026-10-08 第三轮技术债审计 P0：可视化空洞）────────────────────────
  # 病灶（实测 run 37788034328）：7 个 job 里 5 个无 needs 自由起飞，读者在 Actions 面板上
  # 看到的是「一堆灰色块」——skipped 与「本来不跑」不可区分（skipped 的 job steps=0、
  # startedAt==completedAt，无时间线），唯一有清晰视觉语义的 cancelled（黄 + Cancel）
  # 恰恰是「被新 push 作废、不用关心」的终态。**唯一看得懂的终态，是唯一不用关心的终态。**
  # 更糟的是 timeout（40min 静默红）与被上游连坐的 skipped 在面板上同样不可分辨。
  # 本 job 把「红在哪 / 还剩什么没跑 / 各自多久」压成一页 GITHUB_STEP_SUMMARY。
  #
  # 设计要点：
  #   1. needs 列全 7 个 + `if: always()`——缺任一条，上游失败时本 job 就不跑，
  #      恰好在最需要它的时候消失（这是此类汇总 job 最常见的写法错误）。
  #   2. 不 checkout、不装依赖：纯读 `needs.*.result` 上下文，秒级、零成本，自身不可能因
  #      环境问题而红（它是读者判断「谁红了」的唯一入口，不能自己成为噪声源）。
  #   3. 用 `toJSON(needs)` 统一渲染，避免手写 7 份重复的 表格行（新增 job 时只需改 needs 列表）。
  summary:
    name: 汇总（谁红了 / 还剩什么没跑）
    needs: [changes, contracts, frontend, frontend-gates, go, go-analysis, e2e, e2e-web]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 生成 job 结论表
        shell: pwsh
        run: |
          $raw = '${{ toJSON(needs) }}'
          try {
            $needs = $raw | ConvertFrom-Json -ErrorAction Stop
          } catch {
            # 解析失败必须显式红：否则下方 `$needs.$k.result` 静默取 $null → 回落 'unknown'
            # → 无 failure/skipped → 打印「全部通过」＝假绿。汇总层绝不能自己成为假绿源头。
            Write-Error "needs 上下文解析失败（无法生成可信汇总，拒绝输出绿结论）：$_"
            exit 1
          }
          # 结论语义映射：success/failure/cancelled/skipped 四种终态在面板上的可辨识度
          $label = @{
            'success'   = '✅ 通过'
            'failure'   = '❌ 失败'
            'cancelled' = '⚪ 已取消（被新 push 作废，通常无需处理）'
            'skipped'   = '⏭️ 跳过（变更域未命中 / 上游未通过——见「门控」列区分）'
          }
          # job 门控关系（与上方各 job 的 needs 保持一致；改 needs 时同步本表）
          # 2026-10-08 加域裁剪后：各 job 统一 `needs: [changes, …]`，域未命中即 skipped，
          # 那属**预期行为**（省分钟）而非红——故单列「域」列说明该 job 由哪个域触发。
          $gated = @{
            'contracts'      = 'changes(contracts 域)'
            'frontend'       = 'changes(frontend 域)'
            'frontend-gates' = 'changes(frontend 域) + contracts'
            'go'             = 'changes(go 域)'
            'go-analysis'    = 'changes(go 域)'
            'e2e'            = 'changes(frontend 域) + contracts'
            'e2e-web'        = 'changes(frontend 域) + contracts'
          }
          # 变更域实况（changes job 产出）：让读者一眼看出「本轮跳过的 job 是因为没改那部分」
          $dom = '${{ needs.changes.outputs }}'

          $lines = @()
          $lines += '## 门禁汇总 — Test Gate'
          $lines += ''
          $lines += ('**本轮变更域**：`{0}`' -f $dom)
          $lines += ''
          $failed = @()
          $skipped = @()
          $unknown = @()
          $lines += '| Job | 结论 | 触发条件 |'
          $lines += '|---|---|---|'
          foreach ($k in @('contracts','frontend','frontend-gates','go','go-analysis','e2e','e2e-web')) {
            $r = $needs.$k.result
            if (-not $r) {
              $r = 'unknown'
              $unknown += $k
            }
            $txt = if ($label.ContainsKey($r)) { $label[$r] } else { '❓ ' + $r }
            $gate = if ($gated.ContainsKey($k)) { $gated[$k] } else { '无（并行起飞）' }
            $lines += ('| `{0}` | {1} | {2} |' -f $k, $txt, $gate)
            if ($r -eq 'failure') { $failed += $k }
            if ($r -eq 'skipped') { $skipped += $k }
          }
          $lines += ''
          # 结论判定：unknown 视为「不可信」而非「通过」——任何一项读不到结果都不许报绿。
          if ($unknown.Count -gt 0) {
            $ul = ($unknown -join ', ')
            $lines += ('**⚠️ 有 {0} 个 job 结论不可读（`{1}`）——汇总不可信，请直接看上方 job 块。**' -f $unknown.Count, $ul)
          } elseif ($failed.Count -eq 0 -and $skipped.Count -eq 0) {
            $lines += '**结论：全部通过。**'
          } else {
            if ($failed.Count -gt 0) {
              $fl = ($failed -join ', ')
              $lines += ('**❌ 失败 job（{0}）：`{1}`** — 点上方对应 job 看首个失败步骤。' -f $failed.Count, $fl)
            }
            if ($skipped.Count -gt 0) {
              $sl = ($skipped -join ', ')
              $lines += ('**⏭️ 跳过 job（{0}）：`{1}`** — 两种成因，看「触发条件」列区分：' -f $skipped.Count, $sl)
              $lines += '① **变更域未命中**（预期行为，省分钟，**不是红**）；'
              $lines += '② 上游 `contracts` 未通过（那本身会在上面以 ❌ 出现）。'
            }
          }
          $lines += ''
          $lines += '> 覆盖口径（本地）：`node scripts/doctor.ts --docs` 尾行「N/M 项门禁清单条目已接入」'
          $lines += '> ——含非 `check-*` 命名的真闸（jscpd-go / gen-* / auto-import 等）。'
          $lines += '> **全绿 ≠ 仓库无风险**：本地 push 已刻意跳过契约测试（交本 workflow 的 `contracts` job 全量），'
          $lines += '> 故「本地绿、CI 红」在本仓属预期组合，红点应信 CI 这一侧。'

          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # 汇总 job 自身不判定成败：它的职责是「呈现」，不是「加一层阻断」。
          # 红的权威判定仍归各 job（避免汇总层产生新的假红/假绿来源）。
          Write-Host '汇总已写入 GITHUB_STEP_SUMMARY'
          $lines | ForEach-Object { Write-Host $_ }
