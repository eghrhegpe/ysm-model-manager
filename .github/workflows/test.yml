name: Test Gate

# 可复用测试门禁（方案②）：ci.yml（main/PR）与 release.yml（tag 发版）共享，
# 避免 main push 与 tag push 各跑一遍完整测试。
# 版本单点：GO_VERSION / NODE_VERSION / WAILS_VERSION 均读仓库级 Variables。

on:
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: ${{ vars.NODE_VERSION }}
  WAILS_VERSION: ${{ vars.WAILS_VERSION }}

jobs:
  test:
    name: 契约测试 + Go 检查 + 前端构建
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # 契约测试（test_api_break.mjs）用真实历史 ref 对做端到端断言，
          # 浅克隆（默认 depth=1）拿不到历史提交会报「无效 ref」——拉全量历史
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          # workflow_call / fork PR may not expose repository variables;
          # go.mod is the authoritative toolchain requirement.
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 缓存 Go 模块（命中免下载）
        uses: actions/cache@v5.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~\go\pkg\mod' || '~/go/pkg/mod' }}
          key: go-mod-${{ runner.os }}-${{ env.WAILS_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-${{ env.WAILS_VERSION }}-
            go-mod-${{ runner.os }}-

      # winget 安装的 app 链接不会刷新当前 runner 进程 PATH，导致后续步骤找不到 rg；
      # 第三方 ripgrep-action 在 workflow_call 中静态解析失败（startup_failure）。
      # 改为直接从 GitHub 官方 release 下载 -gnu 二进制 zip，解压出 rg.exe 并用 GITHUB_PATH 注入 PATH（跨平台生效）。
      - name: 安装 ripgrep（契约测试依赖 rg 二进制）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "14.1.0"
          $zip = "$env:RUNNER_TEMP\rg.zip"
          $dir = "$env:RUNNER_TEMP\rg-$v"
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/$v/ripgrep-$v-x86_64-pc-windows-gnu.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $rg = Get-ChildItem -Path $dir -Recurse -Filter rg.exe | Select-Object -First 1
          $bin = $rg.Directory.FullName
          Write-Host "rg.exe at: $bin"
          Add-Content -Path "$env:GITHUB_PATH" -Value $bin
          & "$bin\rg.exe" --version

      - name: 契约测试（tests/，Node .mjs，禁止修改测试文件）
        shell: pwsh
        run: |
          $files = Get-ChildItem tests/*.mjs
          foreach ($f in $files) {
            node $f.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "契约测试失败: $($f.Name)（exit=$LASTEXITCODE）"
              exit $LASTEXITCODE
            }
          }

      - name: 绑定契约对账（binding-check — Go 导出 vs -ts 产物）
        shell: pwsh
        run: node scripts/binding-check.ts

      - name: 绑定产物保鲜（重新生成必须零 diff）
        shell: pwsh
        run: |
          npm --prefix frontend run generate:bindings
          git diff --exit-code -- frontend/bindings
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Go 签名变更但 frontend/bindings 未重新生成/提交"
            exit 1
          }

      - name: ADR 登记一致性（adr-check — G-2 治理门槛）
        shell: pwsh
        run: |
          node scripts/adr-check.ts | Out-String -Width 200
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # P1 修复（2026-08-17，门禁锐评 P1-5）：CI 此前零治理检查，远端无防线——
      # redlines 新增红线在 CI 即红，不再只靠本地 pre-push（可被逃生阀绕过）。
      # 注：check-deadcode-baseline 依赖 frontend/node_modules/.bin/knip + jscpd，
      # 必须放在下方「安装前端依赖」（npm ci）之后执行（code_review P1）。
      - name: 红线零新增门禁（check-redlines — R1-R10/W1-W6）
        shell: pwsh
        run: |
          node scripts/check-redlines.ts --json --baseline | Out-String -Width 200
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 安装前端依赖
        working-directory: frontend
        shell: pwsh
        run: npm ci

      - name: 死代码基线门禁（check-deadcode-baseline，依赖 knip/jscpd → npm ci 后跑）
        shell: pwsh
        run: |
          node scripts/check-deadcode-baseline.ts --json | Out-String -Width 200
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 构建更新助手 helper（embed 前置，修复 CI 缺 ysm-updater-helper.exe）
        shell: pwsh
        run: go build -ldflags "-X ysm-model-manager/go/version.Version=ci" -o go/updater/ysm-updater-helper.exe ./cmd/updater

      - name: Go 检查（build + vet + test）
        shell: pwsh
        run: |
          go build ./go/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./go/... ./internal/app/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race ./go/... ./internal/app/ -count=1 -timeout 10m | Out-String -Width 400
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 缓存 Rust 依赖仓库（registry/git）与两个 crate 的 target 编译产物——
      # cargo test + cargo build --release（生产 DLL）每次全量编译是校正流程最重的一环。
      # key 锚定两个 Cargo.lock，restore-keys 兜底低版本命中，参照 Go 模块缓存同款写法。
      - name: 缓存 Rust 依赖与编译产物（命中免编译）
        uses: actions/cache@v5.1.0
        with:
          path: |
            ${{ runner.os == 'Windows' && '~\.cargo\registry' || '~/.cargo/registry' }}
            ${{ runner.os == 'Windows' && '~\.cargo\git' || '~/.cargo/git' }}
            rust-core/target
            rust-wails-bridge/target
          key: cargo-cache-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock', 'rust-wails-bridge/Cargo.lock') }}
          restore-keys: |
            cargo-cache-${{ runner.os }}-

      - name: Rust 扫描器单测（code review P2：此前 CI 零 Rust 覆盖——rust_backend 路径全被 //go:build 排除）
        shell: pwsh
        run: |
          cargo test --manifest-path rust-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path rust-wails-bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust 桥 DLL + rust_backend Go 测试（Windows 生产路径，code review P2）
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path rust-wails-bridge/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force 'go/rustbridge/bin' | Out-Null
          Copy-Item -Force 'rust-wails-bridge/target/release/ysm_model_manager_wails_bridge.dll' 'go/rustbridge/bin/ysm_model_manager_wails_bridge.dll'
          go test -tags rust_backend ./go/scanner/... -count=1 -timeout 5m | Out-String -Width 400
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Go 覆盖率报告（非阻断，趋势可见）
        shell: pwsh
        run: |
          # -p 1 串行：多包并行跑 coverprofile 时 go/scanner 测试存在隔离冲突（flaky），
          # 串行可复现通过（本地已验证）。本步骤仅作覆盖率趋势展示，不构成测试门禁。
          # 注意：-coverprofile=go-cover.out 必须加引号——PowerShell 会把
          # 「go-cover.out」解析成成员访问（值为 null），profile 落盘为 0 字节，
          # 后续 go tool cover -func= 收到空参数报 too many arguments。
          go test ./go/... -coverprofile='go-cover.out' -count=1 -p 1 | Out-String -Width 200
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go tool cover -func='go-cover.out' | Select-String 'total:'

      - name: 前端类型检查（ADR-014 门槛）
        working-directory: frontend
        shell: pwsh
        run: npx tsc --noEmit

      - name: 前端测试（Vitest）
        working-directory: frontend
        shell: pwsh
        run: |
          npx vitest run --coverage | Out-String -Width 200
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 前端构建
        working-directory: frontend
        shell: pwsh
        run: npx vite build

  # ── E2E（Playwright · vite dev 纯前端 + mock bridge，参照 MikuMikuAR 实证模式）──
  # 参数：全局 7 分钟总限 / 每用例 15s / 累计 5 次失败阻断（maxFailures=5）——ADR-037 接入参数。
  # webServer 自动管理 vite dev 生命周期（playwright.config.ts）。
  e2e:
    name: E2E（Playwright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E 类型检查（mock 契约守卫）
        working-directory: frontend
        run: npx tsc -p tsconfig.e2e.json --noEmit

      - name: E2E 测试（7min 总限 / 15s 每项 / maxFailures=5）
        working-directory: frontend
        run: npx playwright test --reporter=line

      - name: 上传 E2E 报告（失败时保留现场）
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: frontend/test-results/
          if-no-files-found: ignore

      - name: E2E 覆盖广度采集（ADR-035 G-4，可选非门禁）
        working-directory: frontend
        run: |
          npx playwright test --config playwright.coverage.config.ts
          node ../scripts/e2e-coverage-report.ts --json

      - uses: actions/upload-artifact@v6
        with:
          name: e2e-coverage-report
          path: frontend/e2e-coverage/
          if-no-files-found: ignore
