# Wails 3 开发配置（联邦标准摆法）
# `wails3 dev` 读取 ./build/config.yml，仅使用 `dev_mode` 段落来驱动
# 热重载引擎 (github.com/atterpac/refresh)。`executes` 中的命令统一委托给
# `wails3 task`（Task 编排器，内置 POSIX shell），不再手写裸 cmd /C，
# 路径分隔符、环境变量、跨平台差异均由 Task 体系统一处理。
version: '3'

info:
  companyName: "YSM"
  productName: "YSM 模型管理器"
  productIdentifier: "com.ysm.modelmanager"
  description: "YSM 模型管理器"
  copyright: "(c) 2025, YSM"
  comments: "Wails 3 dev config"
  version: "1.14.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    # 1) 编译内嵌的更新助手 helper（once，首次启动运行一次，之后不参与每轮重建）
    #    理由：cmd/updater/ 或 go/updater/ 改动频率极低，每次 Go build 都重编
    #    是浪费；首次运行时确保 ysm-updater-helper.exe 存在即可。
    - name: build-helper
      cmd: wails3 task windows:build:helper
      type: once
    # 2) 编译 Go 主二进制（blocking，每次 *.go 变更后由 watcher 重编）
    #    走 wails3 task windows:build:dev：不携带 -tags production，
    #    故启用 !production 构建分支，asset server 代理到 vite dev server。
    #    注意：build:dev 不再依赖 build:helper（已上移为 once 步骤），
    #    避免 helper 被重复编译。
    - name: go-build
      cmd: wails3 task windows:build:dev
      type: blocking
    # 3) vite 开发服务器（background，热重载期间常驻，退出时杀）
    #    端口取 wails3 dev 注入的 WAILS_VITE_PORT（默认 9245）。
    #    delay_next 2000ms：给 Vite 冷启动留缓冲，避免 exe 启动时端口未 ready。
    - name: vite-dev
      cmd: wails3 task common:dev:frontend
      type: background
      delay_next: 2000
    # 4) 运行应用（primary，*.go 变更时由 watcher 先杀后启）
    - name: run-app
      cmd: wails3 task run
      type: primary