version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Signing configuration - edit these values for your project
  # SIGN_CERTIFICATE: "path/to/certificate.pfx"
  # SIGN_THUMBPRINT: "certificate-thumbprint"  # Alternative to SIGN_CERTIFICATE
  # TIMESTAMP_SERVER: "http://timestamp.digicert.com"
  #
  # Password is stored securely in system keychain. Run: wails3 setup signing

  # Docker image for cross-compilation with CGO (used when CGO_ENABLED=1 on non-Windows)
  CROSS_IMAGE: wails-cross
  # Default to host architecture when ARCH is not explicitly set
  ARCH: '{{.ARCH | default "amd64"}}'

tasks:
  check:deps:
    silent: true
    summary: Verifies Windows build prerequisites
    cmds:
      - |
        set -euo pipefail
        echo "Checking Windows build prerequisites..."
        missing=0

        # Go
        if ! command -v go >/dev/null 2>&1; then
          echo "ERROR: go not found. Install: https://go.dev/dl/" >&2
          missing=1
        fi

        # wails3
        if ! command -v wails3 >/dev/null 2>&1; then
          echo "ERROR: wails3 not found. Install: go install github.com/wailsapp/wails/v3/cmd/wails3@latest" >&2
          missing=1
        fi

        # icon.ico (required for .syso generation)
        if [ ! -f "build/windows/icon.ico" ]; then
          echo "ERROR: build/windows/icon.ico not found. Run: wails3 generate icons" >&2
          missing=1
        fi

        # wails.exe.manifest
        if [ ! -f "build/windows/wails.exe.manifest" ]; then
          echo "ERROR: build/windows/wails.exe.manifest not found" >&2
          missing=1
        fi

        # info.json
        if [ ! -f "build/windows/info.json" ]; then
          echo "ERROR: build/windows/info.json not found" >&2
          missing=1
        fi

        # appicon.png (source for icon generation)
        if [ ! -f "build/appicon.png" ]; then
          echo "ERROR: build/appicon.png not found" >&2
          missing=1
        fi

        if [ "$missing" -ne 0 ]; then
          exit 1
        fi
        echo "All prerequisites satisfied."

  build:
    summary: Builds the application for Windows
    deps:
      - task: check:deps
    cmds:
      # Auto-detect CGO: if CGO_ENABLED=1, use Docker; otherwise use native Go cross-compile
      - task: '{{if and (ne OS "windows") (eq .CGO_ENABLED "1")}}build:docker{{else}}build:native{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      # Default to CGO_ENABLED=0 if not explicitly set
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'

  # 开发构建：不挂 production tag，asset server 会代理到 vite dev server。
  # 产物名固定为 bin/{{.APP_NAME}}.exe（= bin/YSM-Model-Manager.exe），与 run 任务一致。
  build:dev:
    summary: Dev build (no production tag; asset server proxies to vite)
    deps:
      - task: check:deps
      # build:helper 已上移到 build/config.yml 的 once 步骤独立执行，
      # 此处不再作为 deps，避免每次 Go build 重复编译 helper。
    cmds:
      - go build -buildvcs=false -gcflags=all="-l" -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe" .

  # 构建内嵌的更新助手 helper。
  # go/updater/updater.go 用 //go:embed ysm-updater-helper.exe 内嵌该二进制，
  # 它由 cmd/updater/main.go 编译生成，且被 .gitignore(*.exe) 忽略、不入库。
  # 因此任何 go build/go vet 之前都必须先构建它（见 scripts/build-release.ps1 步骤 1b）。
  build:helper:
    summary: Builds the embedded updater helper (go/updater requires //go:embed ysm-updater-helper.exe)
    internal: true
    cmds:
      - go build -ldflags="-X ysm-model-manager/go/version.Version={{.APP_VERSION}}" -o "go/updater/ysm-updater-helper.exe" "./cmd/updater"
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  build:rust-bridge:
    summary: Builds the embedded Rust scanner bridge
    internal: true
    # code review P2：非 Windows 主机交叉构建（build:native 的 platforms [linux, darwin] 路径）
    # 无 powershell/不产 .dll（Linux 产 .so）——限定 Windows 主机才构建桥 DLL
    platforms: [windows]
    cmds:
      - cargo build --release --locked --manifest-path rust-wails-bridge/Cargo.toml
      - powershell -NoProfile -Command "New-Item -ItemType Directory -Force 'go/rustbridge/bin' | Out-Null; Copy-Item -Force 'rust-wails-bridge/target/release/ysm_model_manager_wails_bridge.dll' 'go/rustbridge/bin/ysm_model_manager_wails_bridge.dll'"

  build:native:
    summary: Builds the application using native Go cross-compilation
    internal: true
    deps:
      - task: common:go:mod:tidy
      # embed 前置：构建内嵌的更新助手 helper（见 build:helper）
      - task: build:helper
      # code review P2：仅 Windows 主机构建 Rust 桥（非 Windows 交叉编译无 powershell/不产 .dll）
      - '{{if eq OS "windows"}}task: build:rust-bridge{{end}}'
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
      - cmd: powershell -NoProfile -Command "Remove-Item -Path '*.syso'"
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .ARCH "amd64"}},rust_backend{{end}}{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X ysm-model-manager/go/version.Version={{.APP_VERSION}}{{if .YSMHUB_API_KEY}} -X ysm-model-manager/go/cli.embeddedHubAPIKey={{.YSMHUB_API_KEY}}{{end}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: Cross-compiles for Windows using Docker with Zig (for CGO builds on non-Windows)
    internal: true
    deps:
      # embed 前置：构建内嵌的更新助手 helper（见 build:helper）
      - task: build:helper
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for CGO cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .YSMHUB_API_KEY}}-e YSMHUB_API_KEY{{end}} {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} windows {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - rm -f *.syso
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  package:
    summary: Packages the application as NSIS installer or MSIX
    cmds:
      - task: '{{if eq (.FORMAT | default "nsis") "msix"}}create:msix:package{{else}}create:nsis:installer{{end}}'
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
    vars:
      FORMAT: '{{.FORMAT | default "nsis"}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    preconditions:
      - sh: test -f "windows/icon.ico"
        msg: "windows/icon.ico not found. Run: wails3 generate icons"
      - sh: test -f "windows/wails.exe.manifest"
        msg: "windows/wails.exe.manifest not found"
      - sh: test -f "windows/info.json"
        msg: "windows/info.json not found"
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Creates an NSIS installer
    dir: build/windows/nsis
    deps:
      - task: build
    preconditions:
      - sh: command -v makensis >/dev/null 2>&1
        msg: "makensis (NSIS) not found. Install NSIS: https://nsis.sourceforge.io/Download"
      - sh: '[ "{{.INSTALL_SCOPE}}" = "user" ] || [ "{{.INSTALL_SCOPE}}" = "machine" ]'
        msg: "INSTALL_SCOPE must be 'user' or 'machine', got '{{.INSTALL_SCOPE}}'"
      - sh: test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe"
        msg: "Binary not found at {{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe. Run 'task build' first."
    cmds:
      # Create the Microsoft WebView2 bootstrapper if it doesn't exist
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - |
        {{if eq OS "windows"}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
        {{else}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        {{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'

  create:msix:package:
    summary: Creates an MSIX package
    deps:
      - task: build
    preconditions:
      - sh: command -v wails3 >/dev/null 2>&1
        msg: "wails3 not found."
      - sh: test -f "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe"
        msg: "Binary not found. Run 'task build' first."
    cmds:
      - |-
        wails3 tool msix \
          --config "{{.ROOT_DIR}}/wails.json" \
          --name "{{.APP_NAME}}" \
          --executable "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" \
          --arch "{{.ARCH}}" \
          --out "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msix" \
          {{if .CERT_PATH}}--cert "{{.CERT_PATH}}"{{end}} \
          {{if .PUBLISHER}}--publisher "{{.PUBLISHER}}"{{end}} \
          {{if .USE_MSIX_TOOL}}--use-msix-tool{{else}}--use-makeappx{{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      CERT_PATH: '{{.CERT_PATH | default ""}}'
      PUBLISHER: '{{.PUBLISHER | default ""}}'
      USE_MSIX_TOOL: '{{.USE_MSIX_TOOL | default "false"}}'

  install:msix:tools:
    summary: Installs tools required for MSIX packaging
    cmds:
      - wails3 tool msix-install-tools

  run:
    preconditions:
      - sh: test -f "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
        msg: "Binary not found. Run 'task build' or 'task build:dev' first."
      - cmd: |
          powershell -NoProfile -Command "& {
            \$port = if (\$env:WAILS_VITE_PORT) { [int]\$env:WAILS_VITE_PORT } else { 9245 };
            for (\$i = 0; \$i -lt 30; \$i++) {
              try {
                \$tcp = New-Object System.Net.Sockets.TcpClient;
                \$tcp.Connect('127.0.0.1', \$port);
                \$tcp.Close();
                exit 0;
              } catch {}
              Start-Sleep -Milliseconds 300;
            }
            Write-Error ('Vite dev server not ready on 127.0.0.1:' + \$port);
            exit 1;
          }"
        msg: "Waiting for Vite dev server on 127.0.0.1 (retries 10)"
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

  sign:
    summary: Signs the Windows executable
    desc: |
      Signs the .exe with an Authenticode certificate.
      Configure SIGN_CERTIFICATE or SIGN_THUMBPRINT in the vars section at the top of this file.
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: build
    preconditions:
      - sh: '[ -n "{{.SIGN_CERTIFICATE}}" ] || [ -n "{{.SIGN_THUMBPRINT}}" ]'
        msg: "Either SIGN_CERTIFICATE or SIGN_THUMBPRINT is required. Set it in the vars section at the top of build/windows/Taskfile.yml"
      - sh: test -f "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
        msg: "Binary not found. Run 'task build' first."
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.exe" {{if .SIGN_CERTIFICATE}}--certificate {{.SIGN_CERTIFICATE}}{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint {{.SIGN_THUMBPRINT}}{{end}} {{if .TIMESTAMP_SERVER}}--timestamp {{.TIMESTAMP_SERVER}}{{end}}

  sign:installer:
    summary: Signs the NSIS installer
    desc: |
      Creates and signs the NSIS installer.
      Configure SIGN_CERTIFICATE or SIGN_THUMBPRINT in the vars section at the top of this file.
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: create:nsis:installer
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
    vars:
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
    preconditions:
      - sh: '[ -n "{{.SIGN_CERTIFICATE}}" ] || [ -n "{{.SIGN_THUMBPRINT}}" ]'
        msg: "Either SIGN_CERTIFICATE or SIGN_THUMBPRINT is required. Set it in the vars section at the top of build/windows/Taskfile.yml"
    cmds:
      - wails3 tool sign --input "build/windows/nsis/{{.APP_NAME}}-installer.exe" {{if .SIGN_CERTIFICATE}}--certificate {{.SIGN_CERTIFICATE}}{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint {{.SIGN_THUMBPRINT}}{{end}} {{if .TIMESTAMP_SERVER}}--timestamp {{.TIMESTAMP_SERVER}}{{end}}
