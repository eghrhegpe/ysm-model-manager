# YSM 模型管理器 — GitHub Pages 配置
title: YSM 模型管理器
description: Minecraft YSM 模型的一站式管理工具 — 仓库管理、整合包同步、3D 预览

# just-the-docs 主题：原生侧边栏 + 站内搜索（解决文档难以到达问题）
remote_theme: just-the-docs/just-the-docs

# 项目站点子路径（GitHub Pages 项目页必须；否则 /assets/* 资源 404）
baseurl: /ysm-model-manager

# 浅色基调（对齐隔壁 MikuMikuAR VitePress 站点默认浅色观感）
color_scheme: light

# 页内锚点：为标题生成 # 锚点链接（对应 VitePress 右侧「本页导航」）
heading_anchors: true

# 右上角 GitHub 链接（对应隔壁站点导航栏的 GitHub 项）
aux_links:
  "GitHub 源码": "https://github.com/eghrhegpe/ysm-model-manager"
aux_links_new_tab: true

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# 排除非公开文档（内部开发文档，不应作为 Web 页面发布）
exclude:
  # 冻结区整目录（历史归档，含全部 postmortem/sessions/design/reference 与 .txt）
  - archive/
  # 内部治理文档（决策/知识卡/小说/网页版占位——面向开发者，不进宣传站导航）
  - adr/
  - knowledge/
  - novel/
  - app/
  # 开发者向根文档（决策依据/治理规则/审计报告，不进用户向站点）
  - Design.md
  - architecture.md
  - governance-rules.md
  - pitfalls.md
  - review-report.md
  # 生成产物
  - funcmap.md
  - project-map.md
  # 发版记录只保留索引（版本表），版本详情不进导航（releases/README.md 保留）
  - releases/v*
