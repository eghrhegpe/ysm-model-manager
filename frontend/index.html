<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #11111b;
      }
      html:not(.app-ready) body {
        visibility: hidden;
      }
    </style>
    <title>YSM 模型管理器</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/dialogs.css" />
    <link rel="stylesheet" href="css/transitions.css" />
    <script type="module" src="src/app-modules.ts"></script>
  </head>
  <body style="margin: 0; overflow: hidden">
    <!-- 跳过链接：键盘用户直达主内容 -->
    <a href="#main-content" class="skip-link" aria-label="跳过导航，直达主内容">跳过导航</a>
    <div style="display: flex; height: 100vh; overflow: hidden">
      <app-nav aria-label="主导航"></app-nav>
      <!-- 跳过链接目标需可聚焦：fragment 跳转不滚动（overflow:hidden），
           tabindex=-1 让键盘焦点真正移入主内容区（codereview 批次3 P3） -->
      <app-content id="main-content" tabindex="-1" aria-label="主内容区"></app-content>
    </div>
    <app-toast></app-toast>
    <context-menu></context-menu>
  </body>
</html>
