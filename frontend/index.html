<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>YSM 模型管理器</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>"
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/transitions.css" />
    <script type="module" src="src/app-modules.ts"></script>
  </head>
  <body style="margin: 0; overflow: hidden">
    <div style="display: flex; height: 100vh; overflow: hidden">
      <app-nav></app-nav>
      <app-content></app-content>
    </div>
    <div
      id="global-loader"
      style="
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 9999;
        display: none;
      "
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
        style="animation: spin 0.8s linear infinite"
      >
        <circle
          cx="12"
          cy="12"
          r="10"
          stroke="#7c83ff"
          stroke-width="3"
          fill="none"
          stroke-dasharray="31.4 10.5"
          stroke-linecap="round"
        />
      </svg>
    </div>
    <style>
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <app-toast></app-toast>
    <context-menu></context-menu>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // P2 修复：默认页与 page-store 兜底对齐为 repository——
        // 原 "instances" 与 resolveInitialPage 的兜底（repository）冲突，
        // settings/community.ts:742-746 已把同类旧写法标注为「死默认值 bug」。
        // P3 修复（code_review）：读路径包 try/catch（与 page-store.resolveInitialPage
        // 一致）——隐私模式 getItem 抛错会 abort 整个 DOMContentLoaded，nav:change
        // 发射与 loading 监听注册全部丢失
        let defaultPage = "repository";
        try {
          defaultPage = localStorage.getItem("ui-default-page") || "repository";
        } catch {
          /* 隐私模式：localStorage 不可用，回退默认页 */
        }
        window.bus?.emit("nav:change", { page: defaultPage });

        // 加载动画控制
        let loadingCount = 0;
        window.bus?.on("loading:start", () => {
          loadingCount++;
          document.getElementById("global-loader").style.display = "block";
        });
        window.bus?.on("loading:end", () => {
          loadingCount--;
          if (loadingCount <= 0) {
            loadingCount = 0;
            document.getElementById("global-loader").style.display = "none";
          }
        });

        setTimeout(() => {
          window.bus?.emit("toast:show", {
            msg: "✅ YSM 管理器 v1.0 预告版",
            duration: 3000,
            type: "success",
          });
        }, 500);
      });
    </script>
  </body>
</html>
