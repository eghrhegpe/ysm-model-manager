# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/AppData/Roaming/reasonix/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.

config_version = 3   # schema marker for diagnostics; old versions may ignore it
default_model = "deepseek-flash"
# language      = "zh"   # ui/model language; empty = auto-detect from $LANG / $REASONIX_LANG

[agent]
# system_prompt = """..."""   # omit to use the built-in prompt for this version
# system_prompt_file = "prompts/system.md"   # overrides system_prompt when set
# max_steps         = 0   # executor tool-call rounds; 0 = no limit
# planner_max_steps = 12   # planner read-only tool-call rounds; 0 = no limit
temperature       = 0.0
auto_plan   = "on"   # off|on; off keeps plan mode manual
# reasoning_language = "zh"   # visible reasoning language: auto|zh|en
# auto_plan_classifier = "deepseek-flash"   # optional; only used for borderline tasks
soft_compact_ratio  = 0.3   # notice only; keeps cache-first prefix intact
compact_ratio       = 0.5   # try compacting when prompt reaches this fraction
compact_force_ratio = 0.65   # force compacting at this high-water mark
# keep                = ["errors"]   # compaction keep policy: errors, user_marked
# recent_keep         = 2   # minimum recent messages kept verbatim
cold_resume_prune   = true   # elide stale tool results when reopening a session past the provider cache window
# planner_model = "mimo"   # optional: enable two-model collaboration
subagent_model = "deepseek-v4-flash"   # default model for runAs=subagent skills
subagent_models = { review = "deepseek-v4-pro" }   # per-skill overrides
subagent_effort = "high"   # default effort for subagent entry points
subagent_efforts = { deep-init = "high", doctor = "high", ultrawork = "high" }   # per-tool/skill effort overrides
# output_style = "explanatory"   # explanatory | learning | concise | custom; empty = default

[tools]
enabled = []   # empty = all built-in tools
bash_timeout_seconds = 120   # foreground safety cap; set 0 for no tool-local cap

[tools.background_jobs]
stalled_warning_seconds = 900   # warn once per background job after this many quiet seconds; 0 disables

[lsp]
enabled = true   # language server tools; servers launch lazily when used
# [lsp.servers.go]
# command = "gopls"
# args = []
# extensions = [".go"]

[skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra custom skill roots
# excluded_paths = ["~/.agents/skills"]   # hide convention roots without deleting folders
# max_depth = 3   # nested scan depth; set 1 for legacy root-only discovery
# disabled_skills = ["review"]   # hide noisy or unwanted skills

[permissions]
allow = ["Edit", "Bash(mkdir -p:*)", "Bash(git log --oneline -5 && echo \"---\" && git status --short)", "Bash(git tag --list \"v*\" --sort=-version:refname | head -5)", "Bash(git log --oneline --all | head -3)", "Bash(git diff --stat v1.8.9..HEAD | tail -1)", "Bash(git diff --stat HEAD | tail -1)", "Bash(echo \"=== 新文件 ===\" && ls docs/release-notes/v1.9.0.md docs/release-notes/README.md)", "Bash(git log --oneline --all | head -3 && echo \"---\" && git branch -a)", "Bash(git log --oneline origin/main -5 && echo \"===HEAD===\" && git log --oneline HEAD -5)", "Bash(python3 scripts/review.py --json 2>/dev/null | python3 -c \"import json,sys; d=json.load(sys.stdin); r5=next(r for r in d if r['rule_id']=='R5'); print(f'R5: {r5[\\\"count\\\"]} violations'); print('sample:', r5['violations'][:3] if r5['violations'] else 'none')\")", "Bash(python3 -c \"\n# === Corrected data ===\nflash_total = 11495443467 / 1e6  # 11,495.44 M\ncache_miss  = 287568067 / 1e6     # 287.57 M\ntotal_spend = 528.17\n\nprint('=== Corrected Flash Data ===')\nprint(f'Flash total tokens: {flash_total:,.0f}M ({flash_total/1000:.2f}B)')\nprint(f'Cache miss tokens:  {cache_miss:,.0f}M')\nprint(f'Cache hit rate:     1 - {cache_miss:.0f}/{flash_total:.0f} = {(1 - cache_miss/flash_total)*100:.2f}%')\nprint()\n\n# Reconstruct\nhit_rate = 1 - cache_miss / flash_total\nprint(f'Derived hit rate: {hit_rate*100:.2f}%')\nprint()\n\n# Assume all Flash, now compute cost\n# We need to split input/output\n# Let's try different input/output splits and see which matches total_spend\n\nfor io_ratio in [(0.5, 0.5), (0.7, 0.3), (0.8, 0.2), (0.9, 0.1), (0.95, 0.05), (0.98, 0.02)]:\n    input_pct, output_pct = io_ratio\n    total_input = flash_total * input_pct\n    total_output = flash_total * output_pct\n    cache_hit_input = total_input * hit_rate\n    cache_miss_input = total_input * (1 - hit_rate)\n    \n    cost = (cache_hit_input * 0.02 +     # cache hit input @ 0.02/M\n            cache_miss_input * 1.0 +     # cache miss input @ 1/M\n            total_output * 2.0)          # output @ 2/M\n    \n    print(f'  input={input_pct:.0%} output={output_pct:.0%}: '\n          f'hit_in={cache_hit_input:,.0f}M, miss_in={cache_miss_input:,.0f}M, out={total_output:,.0f}M, '\n          f'cost=CNY {cost:.2f}  (vs actual {total_spend:.2f})')\n\")", "Bash(python3 -c \"\nflash_total = 11495443467 / 1e6\ncache_miss  = 287568067 / 1e6\nhit_rate = 1 - cache_miss / flash_total\ntotal_spend = 528.17\n\n# Best-fit: almost all input\ntotal_input = flash_total  # ~99.9% is input\ncache_hit_in = total_input * hit_rate\ncache_miss_in = total_input * (1 - hit_rate)\n\nflash_input_cost = cache_hit_in * 0.02 + cache_miss_in * 1.0\nremaining = total_spend - flash_input_cost\n\nprint('=== Corrected Cost Breakdown ===')\nprint(f'Flash total tokens: {flash_total:,.0f}M')\nprint(f'→ ~99.9% is INPUT tokens (cache miss={cache_miss_in:,.0f}M, cache hit={cache_hit_in:,.0f}M)')\nprint(f'→ Output + Pro is negligible (~{remaining:.2f})')\nprint()\nprint(f'Flash input cache HIT: {cache_hit_in:,.0f}M x 0.02 = CNY {cache_hit_in*0.02:.2f}')\nprint(f'Flash input cache MISS: {cache_miss_in:,.0f}M x 1.00 = CNY {cache_miss_in*1.0:.2f}')\nprint(f'Flash input subtotal:        CNY {flash_input_cost:.2f}')\nprint(f'Remaining (output+Pro):      CNY {remaining:.2f}')\nprint(f'Total:                       CNY {flash_input_cost+remaining:.2f}')\nprint()\nprint('=== Key insight ===')\nprint(f'Cache HIT input: {cache_hit_in:,.0f}M tokens = {cache_hit_in/flash_total*100:.1f}% of total')\nprint(f'  Cost: only CNY {cache_hit_in*0.02:.2f} (at 0.02/M)')\nprint(f'Cache MISS input: {cache_miss_in:,.0f}M tokens = {cache_miss_in/flash_total*100:.1f}% of total')\nprint(f'  Cost: CNY {cache_miss_in*1.0:.2f} (at 1/M)')\nprint()\nprint('The 2.5% cache miss costs MORE than the 97.5% cache hit!')\nprint(f'  Miss cost {cache_miss_in*1.0:.2f} vs Hit cost {cache_hit_in*0.02:.2f}')\n\")", "mcp__github__list_issues", "mcp__github__get_file_contents", "Bash(cd frontend && npx vite build 2>&1 | grep -i error && echo \"ERROR FOUND\" || echo \"Frontend build OK\")"]
[sandbox]
# Confine tool blast radius. File-writers (write_file/edit_file/multi_edit/move_file)
# may only write under workspace_root (empty = current dir) and allow_write extras.
# bash = "enforce" (default) jails each command in an OS sandbox (macOS now;
# graceful fallback elsewhere); "off" disables it. network allows egress.
# workspace_root = ""            # default: current working directory
# allow_write = ["/tmp"]          # extra dirs writers may also modify
bash    = "enforce"
network = true

[statusline]
# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow","cwd"} as JSON on stdin.
# command = "my-statusline.sh"

# External MCP servers. type: "stdio" (default, a subprocess) | "http" | "sse".
# ${VAR} / ${VAR:-default} are expanded from the environment in command/args/env/url/headers.

[[plugins]]
name    = "github"
command = "npx"
args    = ["-y", "@modelcontextprotocol/server-github"]
env     = { GITHUB_TOKEN = "${GITHUB_TOKEN}" }
